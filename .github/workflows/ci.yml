name: Validación continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  containers:
    name: Configuración de contenedores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.container.example config --quiet

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/ECAbogados.sln
      - run: dotnet build backend/ECAbogados.sln --configuration Release --no-restore
      - run: dotnet test backend/ECAbogados.sln --configuration Release --no-build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  publish-containers:
    name: Publicar imágenes Docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [containers, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar API
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.api
          push: true
          tags: |
            ghcr.io/jfrodriguezva/ecgabogados-api:latest
            ghcr.io/jfrodriguezva/ecgabogados-api:${{ github.sha }}
      - name: Publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend/web
          file: frontend/web/Dockerfile
          push: true
          tags: |
            ghcr.io/jfrodriguezva/ecgabogados-web:latest
            ghcr.io/jfrodriguezva/ecgabogados-web:${{ github.sha }}
